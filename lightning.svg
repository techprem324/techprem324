<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f7ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feGaussianBlur stdDeviation="10" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- ambient pulsing lights -->
  <circle cx="180" cy="130" r="180" fill="url(#glowBlue)">
    <animate attributeName="r" values="150;220;150" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="130" r="180" fill="url(#glowPurple)">
    <animate attributeName="r" values="220;150;220" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="130" r="140" fill="url(#glowBlue)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- floating sparks -->
  <g fill="#00f7ff" filter="url(#neon)">
    <circle cx="120" cy="220" r="2"><animate attributeName="cy" values="240;20" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="240" r="1.6"><animate attributeName="cy" values="250;30" dur="5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="240" r="2"><animate attributeName="cy" values="250;10" dur="4.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="230" r="1.8"><animate attributeName="cy" values="250;20" dur="3.8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- lightning bolts (flicker) -->
  <g filter="url(#neon)" fill="#9be8ff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="170,10 120,120 160,120 125,250 215,100 172,100 205,10" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.2;1;0;0;0" keyTimes="0;0.55;0.58;0.62;0.66;0.72;0.8;1" dur="3.2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="840,5 790,115 830,115 795,255 885,100 842,100 875,5" fill="#e0b6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;0.1;1;0;0" keyTimes="0;0.3;0.35;0.38;0.42;0.46;0.55;1" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="500,0 470,90 495,90 470,170 530,70 505,70 525,0" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0;1;0;0" keyTimes="0;0.15;0.17;0.2;0.6;0.62;0.66;1" dur="5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- screen flash on strike -->
  <rect width="1000" height="260" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;0.12;0;0;0" keyTimes="0;0.55;0.58;0.62;0.8;1" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- title -->
  <text x="500" y="135" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="62" font-weight="900" letter-spacing="6" fill="url(#txt)" filter="url(#neon)">
    PREM
    <animate attributeName="opacity" values="1;0.85;1;0.95;1" dur="2.5s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="20" letter-spacing="8" fill="#7dd3fc" opacity="0.9">
    ⚡ BUILD · BREAK · REPEAT ⚡
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
