<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="100%" role="img" aria-label="A cute rabbit running across the page chasing a carrot">
  <style>
    .run{animation:run 9s linear -4s infinite}
    @keyframes run{from{transform:translateX(-220px)}to{transform:translateX(900px)}}
    .hop{animation:hop .6s ease-in-out infinite}
    @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
    .chop{animation:chop .6s ease-in-out .3s infinite}
    @keyframes chop{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-9px) rotate(8deg)}}
    .shadow{transform-origin:24px 76px;animation:sh .6s ease-in-out infinite}
    @keyframes sh{0%,100%{transform:scaleX(1);opacity:.18}50%{transform:scaleX(.7);opacity:.08}}
    .back{transform-origin:14px 62px;animation:back .6s ease-in-out infinite}
    @keyframes back{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-30deg)}}
    .front{transform-origin:36px 60px;animation:front .6s ease-in-out infinite}
    @keyframes front{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(28deg)}}
    .ear1{transform-origin:43px 38px;animation:ear .6s ease-in-out infinite}
    .ear2{transform-origin:49px 38px;animation:ear .6s ease-in-out .08s infinite}
    @keyframes ear{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(12deg)}}
    .tail{transform-origin:5px 54px;animation:tail .3s ease-in-out infinite alternate}
    @keyframes tail{from{transform:scale(1)}to{transform:scale(1.2)}}
    .puff{animation:puff .6s ease-out infinite}
    @keyframes puff{0%{opacity:.55;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-26px,-6px) scale(1.5)}}
    .grass{animation:gr 3s ease-in-out infinite alternate;transform-origin:center bottom}
    @keyframes gr{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}
  </style>

  <!-- ground -->
  <line x1="0" y1="77" x2="900" y2="77" stroke="#8b93b0" stroke-opacity=".4" stroke-width="2" stroke-dasharray="4 9" stroke-linecap="round"/>
  <g fill="none" stroke="#5fae6e" stroke-width="2" stroke-linecap="round">
    <path class="grass" d="M60 77 q-3 -9 -6 -12 M60 77 q0 -10 0 -14 M60 77 q3 -9 7 -12" style="transform-box:fill-box"/>
    <path class="grass" style="animation-delay:.8s" d="M260 77 q-3 -9 -6 -12 M260 77 q0 -10 0 -14 M260 77 q3 -9 7 -12"/>
    <path class="grass" style="animation-delay:1.6s" d="M470 77 q-3 -9 -6 -12 M470 77 q0 -10 0 -14 M470 77 q3 -9 7 -12"/>
    <path class="grass" style="animation-delay:.4s" d="M690 77 q-3 -9 -6 -12 M690 77 q0 -10 0 -14 M690 77 q3 -9 7 -12"/>
    <path class="grass" style="animation-delay:1.2s" d="M850 77 q-3 -9 -6 -12 M850 77 q0 -10 0 -14 M850 77 q3 -9 7 -12"/>
  </g>

  <g class="run">
    <!-- carrot being chased -->
    <g transform="translate(160,56)">
      <g class="chop">
        <polygon points="0,0 24,-6 24,6" fill="#f28c28"/>
        <path d="M8 -2 l4 0 M14 2 l4 0" stroke="#c96f12" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="29" cy="-4" rx="6" ry="2.5" fill="#5fae6e" transform="rotate(-25 29 -4)"/>
        <ellipse cx="30" cy="0" rx="7" ry="2.5" fill="#6fc47e"/>
        <ellipse cx="29" cy="4" rx="6" ry="2.5" fill="#5fae6e" transform="rotate(25 29 4)"/>
      </g>
    </g>

    <!-- dust puffs -->
    <g fill="#8b93b0">
      <circle class="puff" opacity="0" cx="-4" cy="72" r="4"/>
      <circle class="puff" opacity="0" style="animation-delay:.2s" cx="-4" cy="72" r="4"/>
      <circle class="puff" opacity="0" style="animation-delay:.4s" cx="-4" cy="72" r="4"/>
    </g>

    <!-- shadow -->
    <ellipse class="shadow" opacity=".15" cx="24" cy="76" rx="24" ry="3" fill="#000"/>

    <!-- rabbit -->
    <g class="hop" stroke="#8b93b0" stroke-width="1.5">
      <!-- far legs -->
      <g class="front" style="animation-delay:.3s">
        <rect x="33" y="60" width="7" height="15" rx="3.5" fill="#e6dfd2"/>
      </g>
      <g class="back" style="animation-delay:.3s">
        <ellipse cx="14" cy="64" rx="9" ry="7" fill="#e6dfd2"/>
        <ellipse cx="21" cy="73" rx="9" ry="3.5" fill="#e6dfd2"/>
      </g>

      <!-- tail -->
      <circle class="tail" cx="5" cy="54" r="6" fill="#fffdf8"/>

      <!-- body -->
      <ellipse cx="22" cy="56" rx="20" ry="13" fill="#fffdf8"/>

      <!-- near legs -->
      <g class="back">
        <ellipse cx="14" cy="62" rx="10" ry="8" fill="#fffdf8"/>
        <ellipse cx="22" cy="73" rx="9" ry="3.5" fill="#fffdf8"/>
      </g>
      <g class="front">
        <rect x="33" y="60" width="7" height="15" rx="3.5" fill="#fffdf8"/>
      </g>

      <!-- ears -->
      <g class="ear1">
        <ellipse cx="42" cy="25" rx="4.5" ry="13" fill="#fffdf8"/>
        <ellipse cx="42" cy="26" rx="2" ry="8" fill="#f9a8b8" stroke="none"/>
      </g>
      <g class="ear2">
        <ellipse cx="50" cy="26" rx="4.5" ry="12" fill="#fffdf8"/>
        <ellipse cx="50" cy="27" rx="2" ry="7" fill="#f9a8b8" stroke="none"/>
      </g>

      <!-- head -->
      <circle cx="46" cy="46" r="11" fill="#fffdf8"/>
      <circle cx="50" cy="44" r="1.9" fill="#2a2438" stroke="none"/>
      <circle cx="49.5" cy="43.4" r=".6" fill="#fff" stroke="none"/>
      <circle cx="48" cy="50" r="3" fill="#f9a8b8" fill-opacity=".6" stroke="none"/>
      <circle cx="56" cy="47" r="1.6" fill="#f08aa0" stroke="none"/>
      <path d="M56 48 q-2 3 -4 2" fill="none" stroke="#8b93b0" stroke-width="1" stroke-linecap="round"/>
    </g>
  </g>
</svg>
